name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core logic tests (PlannerCore)
        run: swift test --package-path Packages/PlannerCore

  app:
    runs-on: macos-15
    needs: core
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build out

      - name: Build for iOS Simulator (Debug, test ads)
        run: |
          set -o pipefail
          xcodebuild -project ThingsToDoNext.xcodeproj -scheme ThingsToDoNext -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tee build/sim.log | xcbeautify --quiet || \
          (grep -E "error:" build/sim.log | head -80; exit 1)

      - name: Build Release configuration (simulator; what the App Store build compiles)
        run: |
          set -o pipefail
          xcodebuild -project ThingsToDoNext.xcodeproj -scheme ThingsToDoNext -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release \
            CODE_SIGNING_ALLOWED=NO build | tee build/release.log | xcbeautify --quiet || \
          (grep -E "error:" build/release.log | head -80; exit 1)

      - name: Build unsigned device archive (Debug, test ads)
        run: |
          set -o pipefail
          xcodebuild -project ThingsToDoNext.xcodeproj -scheme ThingsToDoNext -configuration Debug \
            -destination 'generic/platform=iOS' -archivePath build/ThingsToDoNext.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tee build/device.log | xcbeautify --quiet || \
          (grep -E "error:" build/device.log | head -80; exit 1)

      - name: Package
        run: |
          mkdir -p out/Payload
          cp -R build/ThingsToDoNext.xcarchive/Products/Applications/ThingsToDoNext.app out/Payload/
          (cd out && zip -qry ThingsToDoNext-unsigned.ipa Payload)
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry ../../../../../out/ThingsToDoNext-simulator.app.zip ThingsToDoNext.app)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: out/*.zip

      - name: Publish to the "ios-latest" release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --cleanup-tag --yes || true
          gh release create ios-latest out/ThingsToDoNext-unsigned.ipa out/ThingsToDoNext-simulator.app.zip \
            --prerelease --target "$GITHUB_SHA" --title "Things to Do Next Planner - latest iOS test build" \
            --notes "Built from ${GITHUB_SHA::7} (Debug configuration, Google test ads). The .ipa is UNSIGNED: install it with Sideloadly/AltStore using your Apple ID, or sign it with your Apple Developer account. The simulator .app.zip runs in the Xcode iOS Simulator."
