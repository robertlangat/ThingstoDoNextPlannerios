        # Only used if you tap "Add to device calendar"; iOS 17 doesn't ask when the system editor is used.
        NSCalendarsWriteOnlyAccessUsageDescription: "Adds the task to your calendar when you ask it to."
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets: []
      gatherCoverageData: false

  ThingsToDoNextWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: PlannerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertlangat.thingstodonext.todaywidget
        PRODUCT_NAME: ThingsToDoNextWidget
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Widget/ThingsToDoNextWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.robertlangat.thingstodonext
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Things to Do Next
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ThingsToDoNextWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
    dependencies:
      - package: PlannerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertlangat.thingstodonext.watchkitapp
        PRODUCT_NAME: ThingsToDoNextWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Things to Do Next
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.robertlangat.thingstodonext
    scheme: {}
