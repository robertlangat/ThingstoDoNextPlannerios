name: Upload to App Store Connect

# Builds a signed Release archive (real ad units) and uploads it to App Store Connect / TestFlight.
# Run manually from the Actions tab once these repository secrets exist (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID          10-character Team ID (developer.apple.com -> Membership)
#   ASC_KEY_ID             App Store Connect API key ID        (Users and Access -> Integrations -> App Store Connect API, role: Admin)
#   ASC_ISSUER_ID          Issuer ID shown on the same page
#   ASC_KEY_P8             Full contents of the downloaded AuthKey_XXXX.p8 file
# Optional: GOOGLE_IOS_CLIENT_ID, GOOGLE_REVERSED_CLIENT_ID (enables Drive sync), AI_BACKEND_URL (https://...)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown on the App Store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      revoke_ci_certs:
        description: "Revoke certificates named 'Created via API' (made by earlier CI runs) first"
        type: boolean
        default: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KEY ISSUER P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v - see the comment at the top of appstore.yml"; exit 1; fi
          done
          # Lengths only (never values): Team ID 10, Key ID 10, Issuer ID 36.
          t=$(printf '%s' "$TEAM" | tr -d ' \r\n\t'); k=$(printf '%s' "$KEY" | tr -d ' \r\n\t'); i=$(printf '%s' "$ISSUER" | tr -d ' \r\n\t')
          echo "APPLE_TEAM_ID: ${#t} chars (expected 10), ASC_KEY_ID: ${#k} chars (expected 10), ASC_ISSUER_ID: ${#i} chars (expected 36)"
          [ ${#t} -eq 10 ] || { echo "::error::APPLE_TEAM_ID should be 10 characters (developer.apple.com -> Account -> Membership details -> Team ID)."; exit 1; }
          [ ${#k} -eq 10 ] || { echo "::error::ASC_KEY_ID should be 10 characters (the Key ID column on the App Store Connect API keys page)."; exit 1; }
          [ ${#i} -eq 36 ] || { echo "::error::ASC_ISSUER_ID should be 36 characters like 69a6de7e-xxxx-xxxx-xxxx-xxxxxxxxxxxx (shown above the keys table)."; exit 1; }
          printf '%s\n' "$P8" | tr -d '\r' > /tmp/check.p8
          grep -q "BEGIN PRIVATE KEY" /tmp/check.p8 || { echo "::error::ASC_KEY_P8 must be the whole AuthKey_XXXX.p8 file, including the -----BEGIN PRIVATE KEY----- and -----END PRIVATE KEY----- lines."; rm -f /tmp/check.p8; exit 1; }
          openssl pkey -in /tmp/check.p8 -noout || { echo "::error::ASC_KEY_P8 isn't a readable private key. Paste the whole .p8 file again."; rm -f /tmp/check.p8; exit 1; }
          rm -f /tmp/check.p8
          echo "All App Store secrets look valid."

      - name: Write signing key and build settings
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          GID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GRID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
          AIURL: ${{ secrets.AI_BACKEND_URL }}
        run: |
          mkdir -p ~/private_keys build
          printf '%s\n' "$P8" | tr -d '\r' > ~/private_keys/AuthKey.p8
          TEAM=$(printf '%s' "$TEAM" | tr -d ' \r\n\t')
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          {
            echo "DEVELOPMENT_TEAM = $TEAM"
            [ -n "$GID" ] && echo "GOOGLE_IOS_CLIENT_ID = $GID"
            [ -n "$GRID" ] && echo "GOOGLE_REVERSED_CLIENT_ID = $GRID"
            [ -n "$AIURL" ] && echo "AI_BACKEND_URL = ${AIURL/\/\//\/\$()\/}"
            true
          } > Config/Secrets.xcconfig
          cat > build/ExportOptions.plist <<PLIST
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          plutil -lint build/ExportOptions.plist

      - name: Refresh signing profiles
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export KEY=$(printf '%s' "$KEY" | tr -d ' \r\n\t') ISSUER=$(printf '%s' "$ISSUER" | tr -d ' \r\n\t') P8_PATH=~/private_keys/AuthKey.p8
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          REVOKE_CI_CERTS=${{ inputs.revoke_ci_certs }} python3 .github/scripts/refresh_profiles.py

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Archive (Release, real ads, automatic signing)
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY=$(printf '%s' "$KEY" | tr -d ' \r\n\t'); ISSUER=$(printf '%s' "$ISSUER" | tr -d ' \r\n\t')
          xcodebuild -project ThingsToDoNext.xcodeproj -scheme ThingsToDoNext -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ThingsToDoNext.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISSUER" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | xcbeautify

      - name: Export and upload to App Store Connect
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          KEY=$(printf '%s' "$KEY" | tr -d ' \r\n\t'); ISSUER=$(printf '%s' "$ISSUER" | tr -d ' \r\n\t')
          xcodebuild -exportArchive -archivePath build/ThingsToDoNext.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISSUER" | xcbeautify
          echo "Uploaded version ${{ inputs.version }} (build ${{ github.run_number }}). It appears in App Store Connect -> TestFlight after processing (10-30 min)."

      - name: Show signing profiles (diagnostics)
        if: failure()
        run: |
          for d in ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles ~/Library/MobileDevice/Provisioning\ Profiles; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              security cms -D -i "$f" > /tmp/p.plist 2>/dev/null || continue
              name=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/p.plist 2>/dev/null)
              created=$(/usr/libexec/PlistBuddy -c "Print :CreationDate" /tmp/p.plist 2>/dev/null)
              groups=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" /tmp/p.plist 2>/dev/null | tr -d '\n' | tr -s ' ')
              echo "PROFILE: $name | created $created | app groups: ${groups:-none}"
            done
          done

      - name: Clean up key
        if: always()
        run: rm -rf ~/private_keys Config/Secrets.xcconfig
